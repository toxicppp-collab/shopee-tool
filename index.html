<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝦皮推廣短網址產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen py-10">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">蝦皮推廣連結轉換器</h1>
        <p class="text-xs text-gray-500 text-center mb-6">貼上商品網址，一鍵轉換成蝦皮官方短網址！</p>

        <!-- 輸入框 -->
        <div class="mb-4">
            <textarea id="shopeeUrl" rows="4" placeholder="請貼上蝦皮商品網址..." 
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-orange-500"></textarea>
        </div>

        <button onclick="generateShortLink()" 
            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition duration-200 text-sm">
            🔥 轉換短網址
        </button>

        <!-- 結果顯示區 -->
        <div id="resultContainer" class="mt-6 hidden">
            <label class="block text-gray-700 text-xs font-bold mb-2">🔗 產出的短網址：</label>
            <div id="outputList" class="space-y-2 bg-gray-50 p-3 border rounded-xl text-xs"></div>
        </div>
    </div>

    <script>
        async function generateShortLink() {
            let inputUrl = document.getElementById('shopeeUrl').value.trim();
            if (!inputUrl) {
                alert('請先輸入網址！');
                return;
            }

            // 這裡未來會跟你的 Google Apps Script 連結進行溝通
            let backendApiUrl = "https://script.google.com/macros/s/AKfycbwm0lrq2KgnDn-MdmozCt9wE3WhIbeFbu4618keJmqfwZ2iNh3R_QnSFxlHC69KLdgK/exec"; // <-- 填入你的 GAS 部署網址

            // 模擬串接回應（實際連線後會帶回真實的 s.shopee.tw 網址）
            let outputDiv = document.getElementById('outputList');
            outputDiv.innerHTML = `<div class="text-gray-500 text-center">正在產生短網址中...</div>`;
            document.getElementById('resultContainer').classList.remove('hidden');

            try {
                /* 
                  實際串接時的程式碼範例：
                  let response = await fetch(backendApiUrl, {
                      method: 'POST',
                      body: JSON.stringify({ url: inputUrl })
                  });
                  let data = await response.json();
                */

                // 暫時的畫面呈現示範
                setTimeout(() => {
                    outputDiv.innerHTML = `
                        <div class="flex items-center justify-between bg-white p-2 border rounded-lg">
                            <a href="https://s.shopee.tw/example" target="_blank" class="text-orange-600 font-bold hover:underline">https://s.shopee.tw/4B0XNYD2L8</a>
                            <span class="text-green-600 text-xs font-bold">轉換成功</span>
                        </div>
                    `;
                }, 1000);

            } catch (error) {
                alert('轉換失敗，請稍後再試');
            }
        }
    </script>
</body>
</html>
